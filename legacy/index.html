<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earthquake Live Map</title>
<style>
  :root { --bg:#04060f; --panel:rgba(12,18,38,.82); --fg:#dbe6ff; --dim:#7f8fb5; --acc:#5ad1ff; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,sans-serif; overflow:hidden; }
  #stars { position:fixed; inset:0; width:100%; height:100%; }
  #app { position:relative; display:flex; height:100%; }
  #globeWrap { flex:1; position:relative; min-width:0; }
  #globe { position:absolute; inset:0; width:100%; height:100%; cursor:grab; }
  #globe:active { cursor:grabbing; }
  aside { width:320px; background:var(--panel); border-left:1px solid #1d2a52; padding:14px; overflow:auto; backdrop-filter:blur(6px); }
  h1 { font-size:18px; margin:0 0 8px; }
  select { width:100%; padding:6px; background:#0b1230; color:var(--fg); border:1px solid #2a3a70; border-radius:6px; }
  .stat { display:flex; justify-content:space-between; margin:6px 0; color:var(--dim); }
  .stat b { color:var(--fg); }
  #msg { color:#ffb86b; min-height:18px; font-size:12px; }
  ol { list-style:none; padding:0; margin:8px 0; }
  li { padding:6px 8px; border-radius:6px; cursor:pointer; border:1px solid transparent; }
  li:hover { background:#14214a; border-color:#2a3a70; }
  li .m { display:inline-block; min-width:42px; font-weight:700; color:var(--acc); }
  li small { display:block; color:var(--dim); }
  .legend { display:flex; height:10px; border-radius:5px; margin:4px 0; background:linear-gradient(90deg,#ffe066,#ff9248,#e8344e,#8a2be2,#2d3cff); }
  .legend-l { display:flex; justify-content:space-between; font-size:11px; color:var(--dim); }
  #tip { position:fixed; pointer-events:none; background:#0b1230; border:1px solid #3a4f9a; border-radius:8px; padding:8px 10px; font-size:12px; display:none; max-width:260px; z-index:5; pointer-events:auto; }
  #tip a { color:var(--acc); }
  @media (max-width:800px){ #app{flex-direction:column;} aside{width:100%;height:42%;border-left:0;border-top:1px solid #1d2a52;} }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="app">
  <div id="globeWrap"><canvas id="globe"></canvas></div>
  <aside>
    <h1>🌍 Earthquake Live Map</h1>
    <select id="feed">
      <option value="all_hour">Past hour – all</option>
      <option value="all_day" selected>Past day – all</option>
      <option value="all_week">Past week – all</option>
      <option value="2.5_week">Past week – M2.5+</option>
    </select>
    <div class="stat"><span>Quakes shown</span><b id="count">–</b></div>
    <div class="stat"><span>Strongest</span><b id="strongest">–</b></div>
    <div class="stat"><span>Last updated</span><b id="updated">–</b></div>
    <div class="stat"><span>Next refresh</span><b id="countdown">–</b></div>
    <div id="msg"></div>
    <div class="legend"></div>
    <div class="legend-l"><span>shallow</span><span>depth</span><span>deep (700 km)</span></div>
    <h3>Top 10 by magnitude</h3>
    <ol id="top"></ol>
    <p style="color:var(--dim);font-size:12px">Drag to rotate · scroll to zoom · circle size = magnitude · pulsing = under 1 h old. Data: USGS.</p>
  </aside>
</div>
<div id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
/* ===== 1. CONFIG ===== */
const FEED_BASE = "https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/";
const LAND_URL  = "https://cdn.jsdelivr.net/npm/world-atlas@2/land-110m.json";
const POLL_SECONDS = 60;          // how often we re-fetch
const SPIN_DEG_PER_SEC = 6;       // idle rotation speed
const RESUME_AFTER_MS = 2500;     // wait after user interaction before spinning again

/* ===== 2. STATE ===== */
let quakes = [];                  // array of GeoJSON features
let land = null;                  // land geometry
let rotation = [0, -20];          // [lambda, phi] : the point of the globe facing us
let zoom = 1;
let lastInteraction = -Infinity;
let nextPollAt = 0;
let hovered = null;
let flyTo = null;                 // animation target when a list item is clicked
let pinned = false;               // tooltip pinned by click

const $ = id => document.getElementById(id);
const canvas = $("globe"), ctx = canvas.getContext("2d");
let W = 0, H = 0, baseR = 0;

/* ===== 3. PROJECTION =====
   d3.geoOrthographic turns [longitude, latitude] (degrees) into [x, y] pixels,
   as if looking at a sphere from space. rotate() chooses which point faces us. */
const projection = d3.geoOrthographic().clipAngle(90).precision(0.5);
const path = d3.geoPath(projection, ctx);   // draws geo shapes straight to the canvas

function resize() {
  const r = window.devicePixelRatio || 1;
  const box = $("globeWrap").getBoundingClientRect();
  W = box.width; H = box.height;
  canvas.width = W * r; canvas.height = H * r;
  ctx.setTransform(r, 0, 0, r, 0, 0);
  baseR = Math.min(W, H) * 0.44;
  drawStars();
}

/* ===== 4. FETCH + POLLING ===== */
async function loadQuakes() {
  const url = FEED_BASE + $("feed").value + ".geojson";
  try {
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);   // fetch doesn't throw on 404/500 itself!
    const data = await res.json();
    quakes = data.features.filter(f => f.geometry && f.properties.mag != null);
    $("msg").textContent = "";
    $("updated").textContent = new Date().toLocaleTimeString();
    updatePanel();
  } catch (err) {
    // Graceful failure: keep the old `quakes` and tell the user.
    $("msg").textContent = "⚠ Update failed (" + err.message + "). Showing previous data; retrying.";
  } finally {
    nextPollAt = Date.now() + POLL_SECONDS * 1000;
  }
}
setInterval(() => {                       // polling timer: once a second
  const left = Math.max(0, Math.round((nextPollAt - Date.now()) / 1000));
  $("countdown").textContent = left + " s";
  if (left === 0) { nextPollAt = Date.now() + POLL_SECONDS * 1000; loadQuakes(); }
}, 1000);
$("feed").addEventListener("change", () => { quakes = []; updatePanel(); loadQuakes(); });

/* ===== 5. VISUAL ENCODING ===== */
// Magnitude is logarithmic (each +1 = ~32x energy), so radius grows exponentially: M1 ~2px, M7 ~ 40px+
const radius = m => (1.6 + Math.pow(1.55, Math.max(m, 0))) * Math.sqrt(zoom);
// Depth -> colour: shallow yellow ... deep blue (km)
const depthColor = d3.scaleLinear().domain([0, 35, 100, 300, 700])
  .range(["#ffe066", "#ff9248", "#e8344e", "#8a2be2", "#2d3cff"]).clamp(true);
const isFresh = f => Date.now() - f.properties.time < 3600e3;

/* ===== 6. DRAW LOOP ===== */
function visible(f) {
  // Great-circle distance between the quake and the globe's centre; < PI/2 = front hemisphere.
  const centre = [-rotation[0], -rotation[1]];
  return d3.geoDistance(f.geometry.coordinates, centre) < Math.PI / 2;
}

let last = performance.now();
function frame(now) {
  const dt = (now - last) / 1000; last = now;

  if (flyTo) {                                    // smooth move to clicked quake
    rotation[0] += (flyTo[0] - rotation[0]) * Math.min(1, dt * 4);
    rotation[1] += (flyTo[1] - rotation[1]) * Math.min(1, dt * 4);
    if (Math.abs(flyTo[0] - rotation[0]) + Math.abs(flyTo[1] - rotation[1]) < 0.2) flyTo = null;
  } else if (Date.now() - lastInteraction > RESUME_AFTER_MS && !pinned) {
    rotation[0] += SPIN_DEG_PER_SEC * dt;         // the planet never sits still
  }

  projection.translate([W / 2, H / 2]).scale(baseR * zoom).rotate(rotation);
  ctx.clearRect(0, 0, W, H);

  // atmosphere glow + ocean
  const R = projection.scale(), g = ctx.createRadialGradient(W/2, H/2, R*0.9, W/2, H/2, R*1.15);
  g.addColorStop(0, "rgba(90,209,255,.35)"); g.addColorStop(1, "rgba(90,209,255,0)");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(W/2, H/2, R*1.15, 0, 7); ctx.fill();
  ctx.beginPath(); path({ type: "Sphere" }); ctx.fillStyle = "#07142e"; ctx.fill();

  ctx.beginPath(); path(d3.geoGraticule10()); ctx.strokeStyle = "rgba(90,140,255,.12)"; ctx.lineWidth = 0.5; ctx.stroke();
  if (land) { ctx.beginPath(); path(land); ctx.fillStyle = "#16315f"; ctx.fill(); ctx.strokeStyle = "#3b66b8"; ctx.lineWidth = 0.7; ctx.stroke(); }

  // Quakes: sort small last so big circles don't hide them
  const t = now / 1000;
  const drawn = [];
  for (const f of quakes) {
    if (!visible(f)) continue;
    const [x, y] = projection(f.geometry.coordinates);   // lon/lat -> screen pixels
    const r = radius(f.properties.mag);
    drawn.push({ f, x, y, r });
  }
  drawn.sort((a, b) => b.r - a.r);
  for (const q of drawn) {
    const c = depthColor(q.f.geometry.coordinates[2] || 0);
    if (isFresh(q.f)) {                           // pulsing ring for new quakes
      const p = (t % 1.5) / 1.5;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r + p * q.r * 1.8 + 2, 0, 7);
      ctx.strokeStyle = c; ctx.globalAlpha = 1 - p; ctx.lineWidth = 2; ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 7);
    ctx.fillStyle = c; ctx.globalAlpha = 0.55; ctx.fill(); ctx.globalAlpha = 1;
    ctx.strokeStyle = q.f === hovered ? "#fff" : c; ctx.lineWidth = q.f === hovered ? 2 : 1; ctx.stroke();
  }
  frame.drawn = drawn;
  requestAnimationFrame(frame);
}

/* ===== 7. INTERACTION ===== */
let drag = null;
canvas.addEventListener("pointerdown", e => { drag = { x: e.clientX, y: e.clientY, rot: [...rotation], moved: false }; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", e => {
  if (drag) {
    const k = 0.25 / zoom;                         // pixels -> degrees
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    rotation = [drag.rot[0] + dx * k, Math.max(-90, Math.min(90, drag.rot[1] - dy * k))];
    lastInteraction = Date.now(); flyTo = null;
  } else if (!pinned) showTip(e);
});
canvas.addEventListener("pointerup", e => {
  if (drag && !drag.moved) { const q = pick(e); if (q) { pinned = true; showTip(e, q); } else { pinned = false; hideTip(); } }
  drag = null; lastInteraction = Date.now();
});
canvas.addEventListener("pointerleave", () => { if (!pinned) hideTip(); });
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  zoom = Math.max(0.6, Math.min(8, zoom * Math.exp(-e.deltaY * 0.0015)));
  lastInteraction = Date.now();
}, { passive: false });

function pick(e) {                                 // nearest drawn circle under the pointer
  const b = canvas.getBoundingClientRect(), mx = e.clientX - b.left, my = e.clientY - b.top;
  let best = null, bd = 1e9;
  for (const q of frame.drawn || []) {
    const d = Math.hypot(q.x - mx, q.y - my);
    if (d <= Math.max(q.r, 6) && d < bd) { best = q; bd = d; }
  }
  return best;
}
function showTip(e, q = pick(e)) {
  hovered = q ? q.f : null;
  if (!q) return hideTip();
  const p = q.f.properties, depth = q.f.geometry.coordinates[2];
  const tip = $("tip");
  tip.innerHTML = `<b>M ${p.mag.toFixed(1)}</b> – ${esc(p.place || "Unknown")}<br>
    ${new Date(p.time).toLocaleString()}<br>Depth: ${depth.toFixed(1)} km<br>
    <a href="${esc(p.url)}" target="_blank" rel="noopener">USGS event page ↗</a>`;
  tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 12, innerWidth - 270) + "px";
  tip.style.top = Math.min(e.clientY + 12, innerHeight - 120) + "px";
}
function hideTip() { $("tip").style.display = "none"; hovered = null; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===== 8. SIDE PANEL ===== */
function updatePanel() {
  $("count").textContent = quakes.length;
  const top = [...quakes].sort((a, b) => b.properties.mag - a.properties.mag).slice(0, 10);
  $("strongest").textContent = top[0] ? `M${top[0].properties.mag.toFixed(1)}` : "–";
  $("top").innerHTML = top.map((f, i) => `<li data-i="${i}"><span class="m">M${f.properties.mag.toFixed(1)}</span>${esc(f.properties.place || "")}<small>${new Date(f.properties.time).toLocaleString()}</small></li>`).join("");
  $("top").querySelectorAll("li").forEach(li => li.onclick = () => {
    const f = top[li.dataset.i], [lon, lat] = f.geometry.coordinates;
    flyTo = [-lon, -lat];                          // rotate so the quake sits at the centre
    lastInteraction = Date.now(); pinned = false; hideTip();
  });
}

/* ===== 9. STARFIELD ===== */
function drawStars() {
  const c = $("stars"); c.width = innerWidth; c.height = innerHeight;
  const s = c.getContext("2d"); let seed = 42;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;   // deterministic so stars don't jump
  for (let i = 0; i < 350; i++) {
    s.fillStyle = `rgba(255,255,255,${0.3 + rnd() * 0.7})`;
    s.beginPath(); s.arc(rnd() * c.width, rnd() * c.height, rnd() * 1.3 + 0.2, 0, 7); s.fill();
  }
}

/* ===== 10. START ===== */
window.addEventListener("resize", resize);
resize();
fetch(LAND_URL).then(r => r.json()).then(t => { land = topojson.feature(t, t.objects.land); })
  .catch(() => { $("msg").textContent = "⚠ Couldn't load world outline (quakes still plot)."; });
loadQuakes();
requestAnimationFrame(frame);
</script>
</body>
</html>
